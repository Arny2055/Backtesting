<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bankroll & Quarter Kelly - Sindicato Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-[#070b14] text-slate-100 min-h-screen flex flex-col antialiased">

    <!-- Header -->
    <header class="bg-[#0b101d]/90 backdrop-blur-md border-b border-slate-800/80 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-emerald-600 to-teal-400 text-white p-2.5 rounded-xl shadow-lg">
                    <i class="fa-solid fa-vault text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-white flex items-center gap-2">
                        Tesorería Sindicato <span class="text-[10px] bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 px-2 py-0.5 rounded-full font-semibold uppercase">Quarter Kelly (0.25x)</span>
                    </h1>
                    <p class="text-xs text-slate-400">Gestión de stake óptimo y control de varianza</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold px-4 py-2.5 rounded-xl transition flex items-center gap-2">
                    <i class="fa-solid fa-calculator"></i> Calculadora
                </a>
                <a href="simulation_worker.html" class="bg-slate-800 hover:bg-slate-700 text-teal-400 text-xs font-semibold px-4 py-2.5 rounded-xl transition flex items-center gap-2">
                    <i class="fa-solid fa-crosshairs"></i> Análisis EV+
                </a>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
        
        <!-- Panel de Configuración de Capital -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
            <div class="bg-[#0b101d] border border-slate-800/80 rounded-3xl p-6 shadow-2xl space-y-3">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Bankroll Global Total ($)</span>
                <input type="number" id="bankrollInput" value="10000" onchange="updateBankroll()" class="w-full bg-[#111827] border border-slate-700 rounded-2xl px-4 py-3 text-xl font-black text-emerald-400 font-mono">
            </div>
            <div class="bg-[#0b101d] border border-slate-800/80 rounded-3xl p-6 shadow-2xl space-y-3">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Criterio Kelly Aplicado</span>
                <div class="text-xl font-black text-teal-400 pt-2 font-mono">0.25x (Quarter Kelly)</div>
            </div>
            <div class="bg-[#0b101d] border border-slate-800/80 rounded-3xl p-6 shadow-2xl space-y-3">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Riesgo de Ruina Controlado</span>
                <div class="text-xl font-black text-white pt-2 font-mono">&lt; 0.01% (Conservador)</div>
            </div>
        </div>

        <!-- Calculadora de Stake Kelly para Apuestas -->
        <div class="bg-[#0b101d] border border-slate-800/80 rounded-3xl p-6 shadow-2xl space-y-4">
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                <i class="fa-solid fa-scale-balanced text-emerald-500"></i> Calculadora de Stake Óptimo por Oportunidad
            </h2>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Probabilidad del Modelo (%)</label>
                    <input type="number" id="calcProb" placeholder="Ej. 55" class="w-full bg-[#111827] border border-slate-700 rounded-2xl px-4 py-2.5 text-xs text-white">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Cuota del Bookie (Decimal)</label>
                    <input type="number" step="0.01" id="calcOdds" placeholder="Ej. 2.05" class="w-full bg-[#111827] border border-slate-700 rounded-2xl px-4 py-2.5 text-xs text-white">
                </div>
                <div class="flex items-end">
                    <button onclick="calculateKelly()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs py-2.5 rounded-2xl transition shadow">Calcular Stake Propuesto</button>
                </div>
            </div>
            <div id="kellyResult" class="bg-[#111827] border border-slate-700/60 p-4 rounded-2xl hidden text-xs font-mono text-slate-200">
                <!-- Resultado dinámico -->
            </div>
        </div>
    </main>

    <script>
        let globalBankroll = 10000;

        window.onload = function() {
            const stored = localStorage.getItem("syndicate_bankroll");
            if (stored) {
                globalBankroll = parseFloat(stored);
                document.getElementById("bankrollInput").value = globalBankroll;
            }
        };

        function updateBankroll() {
            globalBankroll = parseFloat(document.getElementById("bankrollInput").value) || 10000;
            localStorage.setItem("syndicate_bankroll", globalBankroll);
        }

        function calculateKelly() {
            const prob = parseFloat(document.getElementById("calcProb").value) / 100;
            const odds = parseFloat(document.getElementById("calcOdds").value);
            if (!prob || !odds || odds <= 1) return;

            // Fórmula Kelly Completa: f* = (p * b - q) / b  donde b = odds - 1, q = 1 - p
            const b = odds - 1;
            const q = 1 - prob;
            const kellyFull = (prob * b - q) / b;
            
            // Quarter Kelly (0.25x)
            const quarterKelly = kellyFull > 0 ? kellyFull * 0.25 : 0;
            const stakeAmount = globalBankroll * quarterKelly;

            const res = document.getElementById("kellyResult");
            res.classList.remove("hidden");
            res.innerHTML = `
                <div class="grid grid-cols-2 gap-4">
                    <div><span class="text-slate-400 block">Fracción Kelly Recomendada:</span> <strong class="text-emerald-400 text-sm">${(quarterKelly * 100).toFixed(2)}%</strong> del Bankroll</div>
                    <div><span class="text-slate-400 block">Stake Monetario Sindicato:</span> <strong class="text-teal-400 text-sm">$${stakeAmount.toFixed(2)} USD</strong></div>
                </div>
            `;
        }
    </script>
</body>
</html>
