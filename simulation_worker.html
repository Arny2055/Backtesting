<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo de Registro y Análisis de Simulaciones</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-[#070b14] text-slate-100 min-h-screen p-6 flex flex-col items-center">
    
    <div class="max-w-4xl w-full space-y-6">
        <!-- Header -->
        <div class="bg-[#0b101d] border border-slate-800 rounded-3xl p-6 shadow-2xl flex justify-between items-center">
            <div>
                <h1 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-satellite-dish text-emerald-400"></i> Módulo de Simulación Externa (Worker)
                </h1>
                <p class="text-xs text-slate-400 mt-1">Escuchando datos interpolados desde la calculadora Poisson en tiempo real.</p>
            </div>
            <button onclick="clearHistory()" class="bg-rose-950/40 border border-rose-800/60 text-rose-400 hover:bg-rose-900/40 text-xs font-bold px-4 py-2.5 rounded-xl transition">
                Limpiar Historial
            </button>
        </div>

        <!-- Contenedor de Última Simulación Recibida -->
        <div id="simulationDisplay" class="bg-[#0b101d] border border-slate-800 rounded-3xl p-6 shadow-2xl">
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-bolt text-amber-400"></i> Último Partido Sincronizado
            </h2>
            <div id="payloadContent" class="text-xs text-slate-300 font-mono bg-[#111827] p-4 rounded-2xl border border-slate-700/50">
                Esperando datos de simulación... Realiza una simulación en la calculadora principal.
            </div>
        </div>

        <!-- Historial de Simulaciones Registradas -->
        <div class="bg-[#0b101d] border border-slate-800 rounded-3xl p-6 shadow-2xl">
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-clock-rotate-left text-emerald-400"></i> Historial de Sesión
            </h2>
            <div id="historyList" class="space-y-3">
                <p class="text-xs text-slate-500 italic">No hay partidos en el historial reciente.</p>
            </div>
        </div>
    </div>

    <script>
        let simulationHistory = [];

        window.onload = function() {
            loadHistory();
            
            // 1. Escuchar eventos en tiempo real desde la otra ventana / pestaña (CustomEvent)
            window.addEventListener("poissonSimulationCalculated", (event) => {
                handleNewSimulation(event.detail);
            });

            // 2. Sincronizar vía Storage para cambios entre pestañas del navegador
            window.addEventListener("storage", (event) => {
                if (event.key === "last_simulation" && event.newValue) {
                    try {
                        const data = JSON.parse(event.newValue);
                        handleNewSimulation(data);
                    } catch(e) {}
                }
            });

            // Cargar inicial si existe en localStorage
            const storedLast = localStorage.getItem("last_simulation");
            if (storedLast) {
                try {
                    handleNewSimulation(JSON.parse(storedLast), false);
                } catch(e) {}
            }
        };

        function handleNewSimulation(data, addToHistory = true) {
            // Mostrar en pantalla actual
            document.getElementById("payloadContent").innerHTML = `
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-slate-200">
                    <div><span class="text-slate-500 block">Liga:</span> <strong class="text-emerald-400">${data.league}</strong></div>
                    <div><span class="text-slate-500 block">Encuentro:</span> <strong>${data.homeTeam} vs ${data.awayTeam}</strong></div>
                    <div><span class="text-slate-500 block">xG (H - A):</span> <strong>${data.xGHome} - ${data.xGAway}</strong></div>
                    <div><span class="text-slate-500 block">Top Marcador:</span> <strong class="text-teal-400">${data.topScore}</strong></div>
                </div>
            `;

            if (addToHistory) {
                simulationHistory.unshift(data);
                if (simulationHistory.length > 10) simulationHistory.pop();
                renderHistory();
            }
        }

        function loadHistory() {
            const hist = localStorage.getItem("simulation_history");
            if (hist) {
                try {
                    simulationHistory = JSON.parse(hist);
                    renderHistory();
                } catch(e) { simulationHistory = []; }
            }
        }

        function renderHistory() {
            const listContainer = document.getElementById("historyList");
            if (simulationHistory.length === 0) {
                listContainer.innerHTML = `<p class="text-xs text-slate-500 italic">No hay partidos en el historial reciente.</p>`;
                return;
            }

            listContainer.innerHTML = "";
            simulationHistory.forEach(item => {
                const div = document.createElement("div");
                div.className = "bg-[#111827] border border-slate-700/50 p-3.5 rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 text-xs";
                div.innerHTML = `
                    <div>
                        <span class="text-emerald-400 font-bold">${item.homeTeam} vs ${item.awayTeam}</span>
                        <span class="text-slate-400 ml-2">(${item.league})</span>
                        <div class="text-[10px] text-slate-500 mt-0.5">xG: ${item.xGHome} - ${item.xGAway} | 1X2 Prob: ${item.probabilities.homeWin}% / ${item.probabilities.draw}% / ${item.probabilities.awayWin}%</div>
                    </div>
                    <div class="bg-[#070b14] px-3 py-1.5 rounded-xl border border-slate-700/60 font-mono text-teal-400 font-bold">
                        Top: ${item.topScore}
                    </div>
                `;
                listContainer.appendChild(div);
            });

            localStorage.setItem("simulation_history", JSON.stringify(simulationHistory));
        }

        function clearHistory() {
            simulationHistory = [];
            localStorage.removeItem("simulation_history");
            localStorage.removeItem("last_simulation");
            document.getElementById("payloadContent").innerHTML = "Historial limpiado correctamente.";
            renderHistory();
        }
    </script>
</body>
</html>
